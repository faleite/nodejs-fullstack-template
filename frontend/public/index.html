<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ambiente Desenvolvimento Base</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="app.js" defer></script>
</head>
<body class="bg-light">
  <div class="container py-5 text-center">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <div class="card shadow-sm border-0">
          <div class="card-body p-5">
            <h1 class="display-6 text-primary mb-3">🚀 Ambiente de Desenvolvimento Pronto!</h1>
            <p class="lead text-muted mb-4">
              Sua infraestrutura em Docker (Nginx + Node.js + Prisma + PostgreSQL) está configurada e operacional.
            </p>
            
            <div class="alert alert-secondary d-inline-block px-4 py-2" id="statusBadge">
              Verificando conexão com a API backend...
            </div>

            <hr class="my-4">
            
            <p class="small text-muted mb-0">
              Pronto para receber o código do seu novo projeto web.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
